# TLS 反向代理示例：部署时替换域名、证书与后端监听端口。
# 本文件是手工参考配置；init.sh 会按 NGINX_TLS_CERT/KEY 自行生成
# /etc/nginx/conf.d/monitor-backend.conf，两者不要同时启用。
server {
    # 外部 HTTPS 端口与服务域名（api.example.com 这类真实域名才利于证书匹配）。
    listen 443 ssl http2;
    server_name xxx.xxxxxxx.xxx;

    # 使用对应域名的证书链与私钥，仅启用 TLS 1.2 和 TLS 1.3。
    ssl_certificate /etc/letsencrypt/live/xxx.xxxxxxx.xxx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xxx.xxxxxxx.xxx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 代理层上限略高于 Source Map 默认 30 MiB，上游仍按路由限制请求体。
    client_max_body_size 32m;
    # 不写格式名：Debian/Ubuntu 的 nginx.conf 只内置 combined，没有 main，
    # 写成 `... main;` 会报 unknown log format "main"。
    access_log /var/log/nginx/monitor-backend-access.log;
    error_log /var/log/nginx/monitor-backend-error.log;

    # 禁止浏览器猜测响应类型，并为跨域 SDK 上报提供所需响应头。
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Max-Age 86400 always;

    # 预检请求直接返回空响应，无需进入 Nest 服务。
    if ($request_method = OPTIONS) {
        return 204;
    }

    # 私有映射目录与 .map 文件均不允许通过代理静态下载。
    location = /mapdata { return 404; }
    location ^~ /mapdata/ { return 404; }
    location ~* \.map$ { return 404; }

    # ACME HTTP-01 校验目录，供 certbot --webroot -w /var/www/letsencrypt 续期使用。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 将业务请求转发到本机 Nest；此端口应按实际 .env 的 PORT 调整。
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # 保留域名、真实来源与转发链，供上游提取客户端上下文。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上游读取超时，避免长时间占用代理连接。
        proxy_read_timeout 60s;
    }
}

# 80 端口只做 ACME 校验和 HTTPS 跳转，避免 HTTP 明文继续对外提供业务接口。
server {
    listen 80;
    server_name xxx.xxxxxxx.xxx;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
